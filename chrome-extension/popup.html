<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changer le curseur</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Choisir un curseur</h1>
    <select id="cursor-select">
      <option value="default">Par défaut</option>
      <option value="rainbow">Arc-en-ciel</option>
      <option value="heart">Cœur</option>
      <option value="star">Étoile</option>
      <option value="pointer">Pointeur coloré</option>
    </select>
    <button id="save-button">Appliquer</button>
    <p class="helper"><a href="options.html" target="_blank">Ouvrir les options</a></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
