<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Curseur</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Options du curseur</h1>
    <p>Choisis un style pour ton curseur sur les pages web.</p>
    <select id="cursor-select">
      <option value="default">Par défaut</option>
      <option value="rainbow">Arc-en-ciel</option>
      <option value="heart">Cœur</option>
      <option value="star">Étoile</option>
      <option value="pointer">Pointeur coloré</option>
    </select>
    <button id="save-button">Enregistrer</button>
    <p class="helper">Ouvre une page web et recharge-la si nécessaire pour appliquer le style.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
